<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#008080"><meta name="description" content="브라우저에서 사용하는 레트로 데스크톱."><title>RETRO OS</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles/main.css"><link rel="stylesheet" href="./styles/apps-extra.css"><link rel="stylesheet" href="./styles/classic.css"></head>
<body><main id="desktop" aria-label="RETRO OS 바탕화면"><div id="desktop-icons" aria-label="데스크톱 프로그램"></div><div id="window-layer"></div></main>
<div id="start-menu" class="start-menu" hidden><div class="start-rail">RETRO <b>OS</b><span>98</span></div><div id="start-items" role="menu" aria-label="시작 메뉴"></div></div>
<footer id="taskbar"><button id="start-button" class="bevel-button start-button" aria-haspopup="menu" aria-expanded="false"><span id="start-logo"></span><b>시작</b></button><span class="taskbar-separator"></span><button id="show-desktop" class="quick-launch" title="바탕화면 보기" aria-label="모든 창 최소화"></button><div id="task-buttons" aria-label="열려 있는 창"></div><div class="system-tray recessed"><button id="volume-button" aria-label="음소거 설정" title="소리 설정"></button><span class="tray-divider"></span><time id="clock"></time></div></footer>
<div id="context-menu" class="context-menu" hidden></div><div id="toast" role="status" hidden></div>
<dialog id="system-dialog" aria-labelledby="dialog-title"><form method="dialog"><div class="dialog-title"><b id="dialog-title"></b></div><div class="dialog-body"><div id="dialog-icon"></div><div><p id="dialog-message"></p><input id="dialog-input" aria-label="값 입력" maxlength="512" hidden></div></div><div class="dialog-actions"><button id="dialog-cancel" type="button" class="bevel-button">취소</button><button id="dialog-confirm" type="submit" class="bevel-button default-button">확인</button></div></form></dialog>
<button id="boot-screen" aria-label="부팅 건너뛰기"><span class="boot-logo">retro<b>OS</b><sup>98</sup></span><span class="boot-progress"><i></i></span><span class="boot-hint">시작하는 중...</span></button>
<script type="module" src="./src/main.js"></script></body></html>
